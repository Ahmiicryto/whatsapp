# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the web service (API + portal + webhooks), a background worker and Postgres.
# After the first deploy, fill the "sync: false" values in the shared env group.

envVarGroups:
  - name: wa-commerce-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY # 32 random bytes, base64. Never change it after data exists.
        generateValue: true
      - key: APP_BASE_URL # e.g. https://wa-commerce-web.onrender.com (or your custom domain)
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: ALLOW_SIGNUP
        value: "true"
      - key: SHOPIFY_API_KEY # optional: enables one-click "Install app" (OAuth)
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2025-10"
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: DEFAULT_COUNTRY
        value: PK
      - key: DEFAULT_TIMEZONE
        value: Asia/Karachi
      - key: DEFAULT_CURRENCY
        value: PKR
      - key: META_EMBEDDED_SIGNUP_CONFIG_ID # optional: "Connect with Facebook" button
        sync: false
      - key: PLATFORM_REPORT_PHONE # optional: super admin's WhatsApp for the platform report
        sync: false
      - key: GATEWAY_URL # optional: QR login, e.g. https://wa-commerce-gateway.onrender.com
        sync: false
      - key: GATEWAY_SECRET # same value as on the gateway service
        sync: false

services:
  - type: web
    name: wa-commerce-web
    runtime: node
    plan: starter # free instances sleep, which delays Shopify webhooks; use starter or higher
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - fromGroup: wa-commerce-shared
      - key: DATABASE_URL
        fromDatabase:
          name: wa-commerce-db
          property: connectionString

  - type: worker
    name: wa-commerce-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - fromGroup: wa-commerce-shared
      - key: DATABASE_URL
        fromDatabase:
          name: wa-commerce-db
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: "8"

  # Optional: WhatsApp Web-style QR login (unofficial). Remove if you only use the official Cloud API.
  - type: web
    name: wa-commerce-gateway
    runtime: node
    plan: starter # must stay awake to keep phones connected
    rootDir: gateway
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GATEWAY_SECRET
        sync: false
      - key: APP_WEBHOOK_URL # https://YOUR-DOMAIN/webhooks/gateway
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wa-commerce-db
          property: connectionString

databases:
  - name: wa-commerce-db
    plan: basic-256mb
    postgresMajorVersion: "16"
